<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#234c40"/></marker></defs><rect width="1400" height="1000" fill="#faf8ef"/><g font-family="Arial" fill="#234c40"><text x="40" y="50" font-size="28">DRY SERVICE ENCLOSURE / PORT DATUMS</text><text x="40" y="80" font-size="16">FS-01 / REV A / ALL DIMENSIONS mm / REVIEW ONLY — NOT FOR CONSTRUCTION</text><rect x="80" y="160" width="600" height="480" fill="none" stroke="#234c40" stroke-width="1.5"/><rect x="130" y="450" width="76" height="50" fill="none" stroke="#234c40" stroke-width="1.5"/><circle cx="500" cy="520" r="7" stroke="#234c40" fill="none"/><circle cx="570" cy="520" r="7" stroke="#234c40" fill="none"/><circle cx="640" cy="520" r="7" stroke="#234c40" fill="none"/><text x="80" y="130" font-size="16">FRONT / 300 W × 240 H; depth 120; nominal wall 3</text><path d="M80,675 L680,675" stroke="#234c40" marker-start="url(#a)" marker-end="url(#a)"/><text x="385.0" y="665.0" font-size="14">300</text><text x="80" y="720" font-size="16">OLED opening: X25–63, Z70–95. Three Ø7 buttons: X210 / 245 / 280 at Z60.</text><text x="80" y="755" font-size="16">Bottom cable ports: Ø20 at (X,Y) = (55,60), (130,60), (205,60).</text><text x="80" y="790" font-size="16">Carrier 260 × 80 × 3; lid 300 × 120 × 3. Lid holes Ø4.5 at (12,12), (288,12), (12,108), (288,108).</text><rect x="810" y="180" width="360" height="144" fill="none" stroke="#234c40" stroke-width="1.5"/><text x="810" y="150" font-size="16">TOP / 300 × 120</text><text x="790" y="405" font-size="20">RELEASE HOLDS</text><text x="790" y="440" font-size="16">Gasket, hinge, latch and mounting supports</text><text x="790" y="470" font-size="16">Actual board/display dimensions and standoffs</text><text x="790" y="500" font-size="16">Cable glands, bend radius and strain relief</text><text x="790" y="530" font-size="16">IP/weather and electrical inspection</text><text x="80" y="870" font-size="16">A purchased, certified outdoor enclosure is preferred. This custom shell is a packaging proposal, not a rated enclosure.</text></g></svg>