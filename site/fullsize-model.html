<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAAYA — labelled CAD explorer</title><link rel="stylesheet" href="explorer.css"></head><body>
<p class="scope">FULL-SIZE CAD PLACEMENT / BENCH PIN MAP / ENGINEERING REVIEW ONLY</p>
<div class="tools"><label><input id="labels" type="checkbox" checked>Labels</label><label><input id="explode" type="checkbox">Explode</label><label><input id="roof" type="checkbox" checked>Roof</label><label><input id="section" type="checkbox">Section</label><label><input id="cutaway" type="checkbox">See inside enclosure</label><button id="iso">Whole shelter</button><button id="front">Front</button><button id="top">Top</button></div>
<div class="tour"><button id="previous" aria-label="Previous tour component">← Previous</button><span id="tour-step">Guided tour · choose Next to begin</span><button id="next" aria-label="Next tour component">Next →</button></div>
<div class="workspace"><div><div id="view" aria-label="Rotatable 3D shelter. Use labelled buttons or the component list to inspect parts."><svg id="leaders" aria-hidden="true"></svg><div id="annotations"></div></div><p class="hint">Drag to rotate · scroll/pinch to zoom · click a solid or label. Amber outlines identify the selected part. Leader lines identify location, not wiring.</p></div>
<aside id="inspector"><label for="search">Find a component</label><input id="search" type="search" placeholder="Try sensor, fan, ESP32 or roof"><label for="part">Every CAD instance</label><select id="part"><option value="">Choose a component</option></select><button id="focus">Focus selected component</button><div id="info" aria-live="polite">Loading assembly and explanations…</div></aside></div>
<div id="error" role="alert" hidden></div><script type="module" src="fullsize.bundle.js"></script></body></html>
