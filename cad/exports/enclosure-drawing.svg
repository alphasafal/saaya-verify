oke="#275c49" stroke-width=".5"/><circle cx="82" cy="21" r="3.5" fill="none" stroke="#275c49" stroke-width=".5"/><circle cx="100" cy="21" r="3.5" fill="none" stroke="#275c49" stroke-width=".5"/></g><text x="560" y="320" font-size="15">FRONT: 36 x 22 BEZEL OPENING; 3 x Ø7 BUTTONS</text><text x="560" y="350" font-size="14">BUTTON X: 64 / 82 / 100; Z: 24 FROM BASE</text><text x="560" y="380" font-size="14">LID: Ø3.3 AT (7,7), (113,7), (7,83), (113,83)</text><text x="560" y="410" font-size="14">REAR: Ø8 CABLE ENTRIES AT X22 / X95, Z18</text><text x="45" y="530" font-size="14">ASSEMBLY: M3 FASTENERS; CHECK THREAD/PILOT FIT WITH A SMALL COUPON FIRST.</text><text x="45" y="558" font-size="14">NOMINAL 0.3 CLEARANCE IS A STARTING VALUE, NOT A VERIFIED PRINT TOLERANCE.</text><text x="45" y="586" font-size="14">USE INSULATED CARRIER / STANDOFFS. KEEP ANTENNA CLEAR OF METAL AND POWER WIRES.</text><text x="45" y="614" font-size="14">OLED BEZEL IS REPLACEABLE; MEASURE YOUR MODULE BEFORE PRINTING.</text><text x="45" y="642" font-size="14">FOUR BASE TILES: 150 x 120 x 4; ROOF TILES: 160 x 130 x 3; PILLARS: 12 x 12 x 190.</text><text x="45" y="670" font-size="14">ROOF GAP: 16. SOLAR AND EVAPORATIVE MODULES EXCLUDED FROM THE CORE ASSEMBLY.</text><text x="45" y="698" font-size="14">RAIN / UV / STRUCTURAL / ELECTRICAL CERTIFICATION NOT ESTABLISHED.</text></g></svg>