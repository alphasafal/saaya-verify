[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SHT31 Library@2.2.2
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit INA219@1.2.3
  milesburton/DallasTemperature@3.11.0
  paulstoffregen/OneWire@2.3.8
  bblanchon/ArduinoJson@7.3.0
build_flags = -D SAAYA_BENCH_AUTO=0

; Optional Wi-Fi LAN uplink to the local API (POST /telemetry). Credentials come from the
; build machine's environment and are never committed: export SAAYA_WIFI_SSID, SAAYA_WIFI_PASS,
; SAAYA_API_URL (e.g. http://192.168.1.20:8765/telemetry) and SAAYA_DEVICE_TOKEN, then
; pio run -e esp32dev_wifi
[env:esp32dev_wifi]
extends = env:esp32dev
build_flags =
  -D SAAYA_BENCH_AUTO=0
  -D SAAYA_WIFI=1
  '-D SAAYA_WIFI_SSID="${sysenv.SAAYA_WIFI_SSID}"'
  '-D SAAYA_WIFI_PASS="${sysenv.SAAYA_WIFI_PASS}"'
  '-D SAAYA_API_URL="${sysenv.SAAYA_API_URL}"'
  '-D SAAYA_DEVICE_TOKEN="${sysenv.SAAYA_DEVICE_TOKEN}"'

; Field build: automatic fan band enabled (on >= 32 C, off < 31 C, auto stop >= 39 C, restart < 38.5 C).
; Manual mode, fault detection and the help latch are identical to the default build.
[env:esp32dev_field]
extends = env:esp32dev
build_flags = -D SAAYA_BENCH_AUTO=1

; Compile check on Arduino-ESP32 core 3 (the API generation used by Wokwi's online compiler), so the
; firmware/wokwi-full sketch is known to build there too. Same libraries, field build flags.
[env:esp32dev_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${env:esp32dev.lib_deps}
build_flags = -D SAAYA_BENCH_AUTO=1
