name: Validate and publish SAAYA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: c++ -std=c++11 tests/controller_test.cpp -o /tmp/saaya-controller-test && /tmp/saaya-controller-test
      - run: npm ci
      - run: npm run build:model
      - run: python scripts/build_site.py
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow checks
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8765 > /tmp/saaya-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
