name: Validate and publish SAAYA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    needs: cad-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: c++ -std=c++11 tests/controller_test.cpp -o /tmp/saaya-controller-test && /tmp/saaya-controller-test
      - uses: actions/download-artifact@v4
        with:
          name: validated-fullsize-cad
          path: .
      - run: python scripts/build_fullsize_assets.py
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run build:model
      - run: npm run build:fullsize
      - run: python scripts/build_site.py
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow checks
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8765 > /tmp/saaya-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          npm run test:browser
          npm run test:fullsize
          npm run test:teaching
          npm run test:cooling
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: esp32-pio-6.1.18-${{ hashFiles('firmware/platformio.ini') }}
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-bench-firmware-unflashed
          path: firmware/.pio/build/esp32dev/*.bin
  cad-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r cad/fullsize/requirements.txt
      - run: python cad/fullsize/build.py
      - run: python cad/fullsize/validate.py
      - run: python cad/fullsize/drawings.py
      - run: python cad/fullsize/feasibility.py
      - run: python cad/fullsize/cost.py
      - name: Reject invalid or intersecting solids
        run: python -c "import json; r=json.load(open('cad/fullsize/exports/interference.json')); assert not r['invalid_reimported_parts'] and not r['intersections'],r"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-fullsize-cad
          path: |
            cad/fullsize/exports/
            research/costs.json
  deploy:
    needs: [build, firmware, cad-review]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
