idth="355" height="136" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="426" y="558" font-size="18" font-weight="bold">LOCAL API + SQLITE</text><text x="426" y="586" font-size="14">Validate provenance; persist telemetry</text><text x="426" y="609" font-size="14">Freshness / boot-session clock tracking</text><text x="426" y="632" font-size="14">Experiment declaration + immutable results</text><text x="426" y="655" font-size="14">External paired measurements → evaluator</text><rect x="825" y="530" width="340" height="136" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="841" y="558" font-size="18" font-weight="bold">DASHBOARD / COOLPROOF</text><text x="841" y="586" font-size="14">Measured snapshots or synthetic replays</text><text x="841" y="609" font-size="14">Reference + calibration + quality checks</text><text x="841" y="632" font-size="14">Export evidence and exclusions</text><text x="841" y="655" font-size="14">Withhold invalid comparisons</text><path d="M410,277 L192,525" stroke="#2b6253" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M350,595 L405,595" stroke="#2b6253" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M765,595 L820,595" stroke="#2b6253" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="706" width="355" height="113" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="51" y="734" font-size="18" font-weight="bold">INDEPENDENT VALIDATION</text><text x="51" y="762" font-size="14">External calibrated air-speed instrument</text><text x="51" y="785" font-size="14">Matched reference roof / aligned timestamps</text><text x="51" y="808" font-size="14">Occupational WBGT is a separate assessment</text><rect x="425" y="706" width="350" height="113" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="441" y="734" font-size="18" font-weight="bold">OPTIONAL READ-ONLY AI</text><text x="441" y="762" font-size="14">Local model explains completed evidence</text><text x="441" y="785" font-size="14">No actuator control or safety declarations</text><text x="441" y="808" font-size="14">Disabled unless explicitly configured</text><rect x="810" y="706" width="355" height="113" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="826" y="734" font-size="18" font-weight="bold">PUBLIC GITHUB PAGES</text><text x="826" y="762" font-size="14">Static 3D viewer, research and downloads</text><text x="826" y="785" font-size="14">SIMULATED scenarios only; no hosted API</text><text x="826" y="808" font-size="14">Does not connect to or control the device</text></g></svg>