<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#2b6253"/></marker></defs><rect width="1200" height="860" fill="#f7f5ec"/><g font-family="Arial" fill="#183d32"><text x="35" y="44" font-size="28">SAAYA VERIFY / TABLETOP IoT ARCHITECTURE</text><text x="35" y="72" font-size="15">V2 fabrication candidate • Firmware + local software • Physical assembly and calibration unverified</text><rect x="35" y="110" width="315" height="198" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="51" y="138" font-size="18" font-weight="bold">MEASURE</text><text x="51" y="166" font-size="14">SHT31 × 2: outdoor / seated T + RH</text><text x="51" y="189" font-size="14">I²C 0x44 / 0x45 • GPIO21 / 22</text><text x="51" y="212" font-size="14">DS18B20: roof temperature • GPIO4</text><text x="51" y="235" font-size="14">INA219: fan-branch power • I²C 0x40</text><text x="51" y="258" font-size="14">Fan tach • GPIO34 / 2 pulses per rev</text><text x="51" y="281" font-size="14">Water switch • GPIO35 / external pull-up</text><rect x="410" y="145" width="355" height="170" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="426" y="173" font-size="18" font-weight="bold">ESP32 / LOCAL CONTROL</text><text x="426" y="201" font-size="14">Validate values and sensor availability</text><text x="426" y="224" font-size="14">Manual fan control; optional bench auto</text><text x="426" y="247" font-size="14">Fan startup grace + tach fault detection</text><text x="426" y="270" font-size="14">Help latch retained in nonvolatile memory</text><text x="426" y="293" font-size="14">Watchdog; boot ID, sequence, uptime</text><rect x="825" y="110" width="340" height="198" rx="12" fill="#e5eadc" stroke="#95ab9a"/><text x="841" y="138" font-size="18" font-weight="bold">ACT / SHOW</text><text x="841" y="166" font-size="14">4-wire 12 V fan, 25 kHz PWM</text><text 